<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Bootstrap Corta</title>
    <style>
        /* Estilos Core integrados localmente para saltar el bloqueo de red */
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; color: #212529; margin: 0; padding: 3rem; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        .card { background-color: #fff; border: 1px solid rgba(0,0,0,0.125); border-radius: 15px; padding: 2rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15); }
        .text-primary { color: #0d6efd; font-weight: 700; margin-top: 0; }
        .fw-bold { font-weight: 700; }
        .mb-3 { margin-bottom: 1rem; }
        .text-muted { color: #6c757d; font-size: 0.95rem; line-height: 1.5; }
        .btn-primary { display: inline-block; width: 100%; font-weight: 500; text-align: center; cursor: pointer; padding: 0.75rem 1rem; font-size: 1.1rem; border-radius: 0.375rem; color: #fff; background-color: #0d6efd; border: 1px solid #0d6efd; box-sizing: border-box; margin-top: 1.5rem; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #0b5ed7; border-color: #0a58ca; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2 class="text-primary mb-3">¡Hola Bootstrap Seguro!</h2>
            <p class="text-muted">Al integrar los estilos dentro del propio archivo, el sistema ya no necesita conectarse a internet. Ahora sí verás el diseño profesional.</p>
            <button class="btn-primary">Botón de Prueba Inteligente</button>
        </div>
    </div>

</body>
</html>
