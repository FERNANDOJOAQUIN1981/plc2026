<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - Formulario</title>
    <style>
        :root {
            --primary-color: #333;
            --border-color: #ccc;
            --bg-color: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: var(--primary-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        /* Encabezado y Foto */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .title-main {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
            align-self: center;
        }

        .photo-input-container {
            border: 1px dashed var(--border-color);
            width: 100px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 12px;
            background: var(--bg-color);
            cursor: pointer;
            padding: 5px;
        }

        .photo-input-container input[type="file"] {
            display: none;
        }

        /* Secciones */
        fieldset {
            border: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid var(--primary-color);
            width: 100%;
            padding-bottom: 5px;
            margin-bottom: 20px;
            color: #000;
        }

        /* Grilla del Formulario */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        textarea {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0056b3;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Mensaje flotante / Nota complementaria */
        .info-box {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer-text {
            font-size: 13px;
            font-style: italic;
            margin-top: 20px;
            color: #555;
        }

        .date-location-group {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* Botón de envío */
        .btn-container {
            margin-top: 30px;
            text-align: right;
        }

        .btn-submit {
            background-color: #24292e;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2c3e50;
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .form-grid, .date-location-group {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .header-container {
                flex-direction: column-reverse;
                align-items: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- ENCABEZADO Y FOTO -->
            <div class="header-container">
                <h1 class="title-main">CURRICULUM VITAE</h1>
                <label class="photo-input-container">
                    <span>FOTO</span>
                    <span style="font-size: 10px; color: #666; margin-top: 5px;">(Click para subir)</span>
                    <input type="file" name="foto" accept="image/*">
                </label>
            </div>

            <!-- DATOS PERSONALES -->
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" name="dni" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha De Nacimiento:</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </div>
                    <div class="form-group">
                        <label for="lugar">Lugar de Nacimiento:</label>
                        <input type="text" id="lugar" name="lugar">
                    </div>
                    <div class="form-group full-width">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion">
                    </div>
                    <div class="form-group">
                        <label for="localidad">Localidad:</label>
                        <input type="text" id="localidad" name="localidad">
                    </div>
                    <div class="form-group">
                        <label for="provincia">Provincia:</label>
                        <input type="text" id="provincia" name="provincia">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>
                    <div class="form-group">
                        <label for="movil">Teléfono Móvil:</label>
                        <input type="tel" id="movil" name="movil" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="email">E-Mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
            </fieldset>

            <!-- FORMACION Y ESTUDIOS -->
            <fieldset>
                <legend>Formación y Estudios</legend>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="titulacion">Titulación:</label>
                        <input type="text" id="titulacion" name="titulacion">
                    </div>
                    <div class="form-group full-width">
                        <label for="idiomas">Idiomas:</label>
                        <textarea id="idiomas" name="idiomas" placeholder="Ej: Inglés (Avanzado), Francés (Básico)"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="informatica">Conocimientos informáticos:</label>
                        <textarea id="informatica" name="informatica"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="cursos">Cursos y seminarios:</label>
                        <textarea id="cursos" name="cursos"></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- EXPERIENCIA PROFESIONAL -->
            <fieldset>
                <legend>Experiencia Profesional</legend>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="empresa">Empresa:</label>
                        <input type="text" id="empresa" name="empresa">
                    </div>
                    <div class="form-group">
                        <label for="fecha_experiencia">Fecha:</label>
                        <input type="text" id="fecha_experiencia" name="fecha_experiencia" placeholder="Ej: Ene 2024 - Presente">
                    </div>
                    <div class="form-group full-width">
